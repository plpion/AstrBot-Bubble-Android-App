name: Build Android APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true
          
      - name: Clean project
        run: flutter clean
        
      - name: Fix dependency conflicts
        run: |
          # 自动把 pubspec.yaml 里的 ^1.9.1 替换成 1.9.0，解决冲突
          sed -i 's/\^1.9.1/1.9.0/g' pubspec.yaml
          flutter pub get
        
      - name: Build APK
        run: flutter build apk --release
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AstrBot-APK
          path: build/app/outputs/flutter-apk/app-release.apk
